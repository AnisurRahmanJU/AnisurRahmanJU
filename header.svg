<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bangers&amp;family=Baloo+2:wght@700&amp;display=swap');
      .title {
        font-family: 'Bangers', cursive;
        font-size: 64px;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: 'Baloo 2', cursive;
        font-size: 20px;
        font-weight: 700;
      }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="35%" stop-color="#FFD93D"/>
      <stop offset="65%" stop-color="#6BCB77"/>
      <stop offset="100%" stop-color="#4D96FF"/>
