  <rect width="900" height="180" rx="18" fill="#0d1117"/>

  <text x="450" y="95" text-anchor="middle" class="title" fill="url(#grad1)" stroke="#0d1117" stroke-width="2">
    Md. Anisur Rahman
  </text>

  <text x="450" y="135" text-anchor="middle" class="subtitle" fill="url(#grad2)">
